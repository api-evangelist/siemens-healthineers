- aid: siemens-healthineers:teamplay-dicom-image-access-api
  name: teamplay DICOM Image Access API
  description: Imaging access surface enabling partner applications to retrieve DICOM studies and instances stored in
    the teamplay digital health platform. Supports the secure peer sharing and processing use cases highlighted in the
    Digital Marketplace partner program. DICOM transport semantics and authentication are documented behind the
    developer portal.
