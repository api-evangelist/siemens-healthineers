- aid: siemens-healthineers:digital-marketplace
  name: Siemens Healthineers Digital Marketplace
  description: Curated catalog distributing Siemens Healthineers and partner clinical and operational applications
    across the teamplay digital health platform, syngo.via OpenApps, and Cios mobile C-arm systems. All applications
    are security-scanned and run inside the Healthineers privacy-by-design infrastructure. Available in 60+ countries.
    Marketplace surface (browse, install, request quotation, trial) is consumer-facing; partner onboarding is a
    four-step gated review process.
