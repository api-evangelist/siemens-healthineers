name: Siemens Healthineers
description: Siemens Healthineers AG is a German medical technology company (XETRA SHL) covering medical imaging,
  laboratory diagnostics, point-of-care testing, advanced therapies, and cancer care (following the April 2021
  Varian Medical Systems acquisition for USD 16.4 billion). Its digital surface is anchored by the teamplay digital
  health platform, the Digital Marketplace, syngo.via OpenApps, and the Frontier Development Kit, with developer
  access offered through a gated teamplay developer portal that exposes APIs for single sign-on, licensing, user
  roles and permissions, the teamplay receiver plug-in, DICOM image access, customer-specific report submission,
  and status indicator notifications. No public OpenAPI specifications are published; the API catalog and reference
  documentation sit behind teamplay developer account authentication.
