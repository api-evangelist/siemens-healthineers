- aid: siemens-healthineers:teamplay-receiver-plugin-api
  name: teamplay Receiver Plug-in API
  description: Plug-in surface for the teamplay receiver, the on-premises agent that collects operational and clinical
    telemetry from imaging devices and transmits it to the teamplay Cloud Platform. Used by partner applications that
    need to inject or consume the receiver's data collection pipeline. Reference is provided through the gated
    developer portal.
