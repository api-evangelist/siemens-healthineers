- aid: siemens-healthineers:syngovia-openapps-platform
  name: syngo.via OpenApps Platform
  description: Application platform inside syngo.via that hosts third-party and Siemens Healthineers research and
    clinical apps distributed through the Digital Marketplace. Partner apps integrate with syngo.via OpenApps using
    the same Digital Marketplace integration capabilities (SSO, licensing, user roles, DICOM access). Apps can be
    trialed commitment-free for 90 days.
