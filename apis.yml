- aid: siemens-healthineers:teamplay-single-sign-on-api
  name: teamplay Single Sign-On API
  description: Authentication and identity federation surface that lets partner applications running on the teamplay
    digital health platform, syngo.via OpenApps, and Cios mobile C-arm systems sign users in using their teamplay
    credentials. Documented as part of the Siemens Healthineers Digital Marketplace for Partners integration
    capabilities. API reference is gated behind a teamplay developer account.
  humanURL: https://www.siemens-healthineers.com/en-us/digital-health-solutions/digital-marketplace-for-partners
