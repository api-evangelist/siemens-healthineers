- aid: siemens-healthineers:syngovia-frontier-development-kit
  name: syngo.via Frontier Development Kit
  description: Research-oriented SDK that lets clinicians, researchers, and developers turn research ideas into
    deployable image-post-processing applications inside syngo.via. Frontier applications are distributed through
    the Siemens Healthineers Digital Marketplace and installed into syngo.via OpenApps environments. SDK assets
    and reference materials live inside the syngo.via Frontier program rather than a public package registry.
  humanURL: https://www.siemens-healthineers.com/digital-health-solutions/syngovia-frontier
